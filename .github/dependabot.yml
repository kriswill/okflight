version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    ignore:
      # svelte-check consumes TypeScript's JS API, which the TS 7 package
      # (Go binary only) no longer ships. Stay on the 6.x line until
      # svelte-check runs on TS 7 alone. `bun check` covers the plain
      # TypeScript, so TS 7 isn't needed for that.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
