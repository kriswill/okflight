# Nix CI: `nix flake check` builds the okf package and runs the unit-test
# check, pushing everything built to the account's private FlakeHub cache
# (pulled back by later runs, by kriswill/dotfiles CI — which consumes okf
# as a flake input — and by the machines via `determinate-nixd login`).
#
# Both platforms dotfiles actually consumes okf on: x86_64-linux (nebula)
# and aarch64-darwin (the Macs; macos-latest is arm64). Free on public
# repos, macOS included.
#
# Auth is the job's OIDC JWT (`id-token: write`) — the cache is
# account-scoped, so no secret and no per-repo registration exist. Fork
# PRs get no id-token: they build fine, only the cache push is skipped.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the FlakeHub Cache credential

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3.24.1

      - uses: DeterminateSystems/flakehub-cache-action@5a904648441896ace9bab97c70b321339eb127ed # main 2026-07

      - run: nix flake check -L

      # `nix flake check` builds only checks.* — packages are eval'd but
      # "build skipped" (verified 2026-07-12: only okf-tests + the
      # node_modules FOD landed in the cache). Build the binary explicitly
      # so the thing consumers actually run gets cached too.
      - run: nix build .#okf -L

  # Windows has no Nix runner, so it runs the same unit tests under plain bun
  # (npm-installed okf is the supported path there). The runner checks out
  # with core.autocrlf=true, so this also covers CRLF bundles.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - run: bun test
